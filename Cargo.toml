[workspace]
members = ["server", "data-service", "evm", "mcp-server", "loadtest"]
resolver = "3"

[workspace.package]

# The one place payserver-commons is pinned.
#
# `rev` is what makes a build reproducible: with the old sibling-path `[patch]`
# the lock file recorded no commons revision at all, so which code you got was
# decided by CI shell logic and by whatever `main` happened to be that minute.
# Rebuilding last week's commit silently picked up this week's commons, and a
# breaking change to a shared crate broke `testnet` the moment it merged
# (that happened on 2026-09-06).
#
# To work against a local commons checkout, do NOT edit this. Run
# `scripts/commons.sh link`, which writes an uncommitted `.cargo/config.toml`
# patch. To move the pin, `scripts/commons.sh pin <rev>`.
[workspace.dependencies]
api-types = { git = "https://github.com/agent8-cash/payserver-commons.git", rev = "a0e45b76df86acbd6587b507434420fc91205534" }
scrub = { git = "https://github.com/agent8-cash/payserver-commons.git", rev = "a0e45b76df86acbd6587b507434420fc91205534" }
types = { git = "https://github.com/agent8-cash/payserver-commons.git", rev = "a0e45b76df86acbd6587b507434420fc91205534" }
auth = { git = "https://github.com/agent8-cash/payserver-commons.git", rev = "a0e45b76df86acbd6587b507434420fc91205534" }
crypto = { git = "https://github.com/agent8-cash/payserver-commons.git", rev = "a0e45b76df86acbd6587b507434420fc91205534" }
rates = { git = "https://github.com/agent8-cash/payserver-commons.git", rev = "a0e45b76df86acbd6587b507434420fc91205534" }
payserver-plugin-api = { git = "https://github.com/agent8-cash/payserver-commons.git", rev = "a0e45b76df86acbd6587b507434420fc91205534" }
payserver-plugin-host = { git = "https://github.com/agent8-cash/payserver-commons.git", rev = "a0e45b76df86acbd6587b507434420fc91205534" }
