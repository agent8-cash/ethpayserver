[package]
name = "mcp-server"
version = "0.1.0"
edition = "2024"
description = "MCP server for ethpayserver - exposes invoice and payment tools for AI agents"
license = "MIT"

[[bin]]
name = "ethpay-mcp"
path = "src/main.rs"

[dependencies]
# Internal crates
data-service = { path = "../data-service" }
auth = { workspace = true }
types = { workspace = true }
evm = { path = "../evm", features = ["redis"] }
rates = { workspace = true }
crypto = { workspace = true }

# MCP SDK
rmcp = { version = "3", features = ["server", "transport-io", "schemars"] }

# Async runtime
tokio = { version = "1.42", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Auth
sha2 = "0.10"
hex = "0.4"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
rust_decimal = "1.36"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"

[dev-dependencies]
tokio = { version = "1.42", features = ["test-util", "rt-multi-thread", "macros"] }
data-service = { path = "../data-service", features = ["test-utils"] }
