[package]
name = "data-service"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Data access layer for PayServer"

[features]
default = ["postgres"]
postgres = ["dep:sqlx"]
redis = ["dep:redis"]
test-utils = []
# AWS KMS as an xpub-encryption key provider. Off by default: a consumer of
# this crate alone (not server/mcp-server, which enable it to support both
# providers at runtime from one binary - see their own Cargo.toml) that never
# turns this on links nothing AWS-specific.
kms = ["dep:aws-sdk-kms", "dep:aws-config"]

[dependencies]
types = { workspace = true }
auth = { workspace = true }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid"], optional = true }
tokio = { version = "1.42", features = ["sync"] }
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
thiserror = "2.0"
async-trait = "0.1"
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"], optional = true }
tracing = "0.1"
metrics = "0.24"
crypto = { workspace = true }
hmac = "0.12"
sha2 = "0.10"
anyhow = "1.0"
aws-sdk-kms = { version = "1.133.0", optional = true, default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-config = { version = "1.13.3", optional = true }
zeroize = "1.8"

[lints.clippy]
too_many_lines = { level = "deny", priority = -1 }
cognitive_complexity = "deny"

[dev-dependencies]
tokio = { version = "1.42", features = ["rt-multi-thread", "macros"] }
