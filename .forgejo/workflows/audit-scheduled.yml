name: Scheduled audit

# The in-CI `audit` job only runs when something is pushed. Advisories are
# published against code that is already merged, so a quiet repo goes stale
# silently: seven weeks without a push left four RUSTSEC advisories blocking
# the audit gate, and the first symptom was CI refusing to build
# (2026-08-19). This runs on a clock instead of on activity, and files an issue
# so the next session sees it without anyone reading a workflow log.

on:
  schedule:
    # Daily 07:00 UTC, not weekly. RUSTSEC-2026-0285 was published into the
    # advisory database on 2026-09-15, a Tuesday; this job had passed on the
    # Monday and would not have run again until the following Monday, so the
    # first thing to notice would have been - and was - a deploy that stopped
    # happening. A day of exposure instead of a week, for one extra run.
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: cargo audit + deny
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTFLAGS: ""
    outputs:
      report: ${{ steps.audit.outputs.report }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testnet

      - uses: https://github.com/dtolnay/rust-toolchain@stable

      - name: Install audit tools
        run: cargo install cargo-audit cargo-deny --locked

      - name: Run audit
        id: audit
        run: |
          set +e
          out=$(cargo audit 2>&1); audit_rc=$?
          deny=$(cargo deny check licenses sources 2>&1); deny_rc=$?
          set -e

          {
            echo "report<<REPORT_EOF"
            echo "### cargo audit (exit $audit_rc)"
            echo '```'
            echo "$out" | tail -60
            echo '```'
            echo "### cargo deny (exit $deny_rc)"
            echo '```'
            echo "$deny" | tail -30
            echo '```'
            echo "REPORT_EOF"
          } >> "$GITHUB_OUTPUT"

          echo "$out" | tail -40
          [ "$audit_rc" -eq 0 ] && [ "$deny_rc" -eq 0 ] || exit 1

      - name: File an issue on findings
        if: failure()
        uses: https://github.com/actions/github-script@v7
        with:
          script: |
            const title = 'Scheduled audit: new advisories on testnet';
            const body = [
              'The weekly scheduled audit failed. `.cargo/audit.toml` holds the',
              'ignore list for advisories that are genuinely unreachable — add to it',
              'only with a reason, and prefer bumping.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              process.env.REPORT || '(report unavailable)',
            ].join('\n');

            // Reuse the open issue if there is one, so a stale advisory does not
            // file a fresh issue every Monday.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security',
            });
            const match = existing.data.find(i => i.title === title);
            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['security'],
              });
            }
        env:
          REPORT: ${{ steps.audit.outputs.report }}
