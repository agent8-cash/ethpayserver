# Every entry below is checked by scripts/check-advisory-ignores.sh (plus the
# two narrower guards it defers to for wasmtime and zip): it fails once the
# advisory is fixed upstream or the crate it names is no longer reachable from
# any workspace member. Twelve entries this covered were already dead —
# fixed upstream, or never reachable in the first place — and were removed in
# the same change that added the check. Each surviving entry names the crate,
# the path that pulls it in, and the condition under which it stops applying,
# so the next review does not start from "upstream transitive dep".
[advisories]
ignore = [
    # paste is unmaintained (no patched version will ever land - the
    # advisory's own [versions] is empty). Pulled in by
    # paste <- alloy-primitives <- auth (payserver-commons) <- data-service,
    # server. Stops applying only if that path drops paste - alloy forking
    # away from it, or commons dropping alloy-primitives.
    "RUSTSEC-2024-0436", # paste unmaintained - see the note above
    # zip RUSTSEC-2026-0367/0368/0369 ignores removed: the lock is on zip
    # 9.2.2, which is a fixed release for all three, and
    # scripts/check-zip-ignores.sh fails once that happens with any of them
    # still listed. They were only ever here because zip 3.0.0 could not be
    # left behind without utoipa 6, and that is what this change did. The
    # fourth advisory in the same family, RUSTSEC-2026-0429, was never
    # ignorable: it is the one that turned the whole gate red and forced the
    # bump, because `Vec::with_capacity` aborts the process rather than
    # panicking, so no caller could have contained it.
    # MAINNET BLOCKER. Timing variability in operations crypto-bigint
    # intends to be constant-time (published 2026-10-23, fixed upstream at
    # >=0.7.6). EXPIRES 2026-11-23 or any mainnet deploy, whichever is sooner -
    # re-run `cargo update -p crypto-bigint --precise 0.7.6 --dry-run` then;
    # if elliptic-curve/k256/alloy have moved to a compatible chain by then,
    # take the bump instead of renewing this.
    #
    # PATH: crypto-bigint 0.5.5 -> elliptic-curve 0.13.8 -> {ecdsa 0.16.9 ->
    # k256 0.13.4, alloy-signer 1.8.3} -> evm/server. Bump attempted and
    # confirmed to cascade 2026-10-24: elliptic-curve 0.13.8 pins
    # `crypto-bigint = "^0.5"` and will not take 0.7.x; alloy 1.8.3 is
    # upstream's current latest (`cargo update -p alloy` locks 0 packages),
    # so there is no available path today that does not wait on alloy and
    # the whole RustCrypto chain to publish compatible new majors.
    #
    # WHY NOT EXPLOITABLE HERE, traced through every real (non-test) caller,
    # not asserted: the only code that feeds a derived private key into a
    # crypto-bigint-adjacent operation is evm/src/transaction.rs
    # (send_native_transfer and its sibling, via HdWallet::derive_private_key).
    # That module is gated behind the `hot-wallet` feature (evm/Cargo.toml),
    # which is absent from `default = []`, never passed by any CI workflow,
    # and documented in the module's own header as reserved for "a possible
    # future hot-wallet mode - a deliberate product decision that has not
    # been made". The deployed binary never compiles it in. The other real
    # k256 usage (server/src/api/users/wallets.rs's verify_wallet_signature)
    # is ECDSA signature RECOVERY from a signature the user's own wallet
    # already produced - a public operation on public inputs, nothing secret
    # to leak via timing. derive_private_key's only other callers are its own
    # unit tests.
    "RUSTSEC-2026-0387", # crypto-bigint timing variability - see the note above
    # rmcp RUSTSEC-2026-0462 (unbounded response body buffering) and
    # RUSTSEC-2026-0457 (OAuth SSRF filter host string check). Both published
    # 2026-10-22/11-05, fixes available in rmcp >=3.7.0 and >=3.9.0 respectively.
    # EXPIRES 2026-12-10 or when mcp-server upgrades rmcp to >= 3.9.0, whichever is sooner.
    # Re-evaluate before that date whether rmcp 3.x is compatible with the
    # existing API usage in mcp-server/src, or whether these can be tolerated.
    #
    # PATH: rmcp 2.1.0 <- mcp-server 0.1.0 <- workspace. mcp-server pins
    # rmcp = { version = "2.0", ... } in mcp-server/Cargo.toml (allows >=2.0.0,
    # <3.0.0). No patched release exists in the 2.x line; the fixes require a
    # major version bump to 3.x which would need API compatibility review.
    #
    # WHY NOT EXPLOITABLE IN THIS CONTEXT, traced through the current usage:
    # - RUSTSEC-2026-0462 (unbounded response buffering) applies to streamable
    #   HTTP clients. mcp-server uses rmcp with stdio transport only
    #   (rmcp::transport::stdio), not HTTP, so response streaming is not involved.
    # - RUSTSEC-2026-0457 (OAuth SSRF filter) applies to OAuth client flows.
    #   mcp-server has no OAuth usage (grepped mcp-server/ for oauth/OAuth patterns,
    #   found none); stdio transport uses no host name resolution or external network
    #   connections beyond what the application layer (data-service) already does.
    "RUSTSEC-2026-0462",
    "RUSTSEC-2026-0457",
    # wasmtime RUSTSEC-2026-0315/0316/0325/0326/0327 ignores removed: the
    # commons `rev` bump landed, wasmtime is >=48.0.4, and
    # scripts/check-wasmtime-ignores.sh now fails on a fixed release with any
    # of the five still listed.
]
