# Every entry below is checked by scripts/check-advisory-ignores.sh (plus the
# two narrower guards it defers to for wasmtime and zip): it fails once the
# advisory is fixed upstream or the crate it names is no longer reachable from
# any workspace member. Twelve entries this covered were already dead —
# fixed upstream, or never reachable in the first place — and were removed in
# the same change that added the check. Each surviving entry names the crate,
# the path that pulls it in, and the condition under which it stops applying,
# so the next review does not start from "upstream transitive dep".
[advisories]
ignore = [
    # paste is unmaintained (no patched version will ever land - the
    # advisory's own [versions] is empty). Pulled in by
    # paste <- alloy-primitives <- auth (payserver-commons) <- data-service,
    # server. Stops applying only if that path drops paste - alloy forking
    # away from it, or commons dropping alloy-primitives.
    "RUSTSEC-2024-0436", # paste unmaintained - see the note above
    # zip RUSTSEC-2026-0367/0368/0369 ignores removed: the lock is on zip
    # 9.2.2, which is a fixed release for all three, and
    # scripts/check-zip-ignores.sh fails once that happens with any of them
    # still listed. They were only ever here because zip 3.0.0 could not be
    # left behind without utoipa 6, and that is what this change did. The
    # fourth advisory in the same family, RUSTSEC-2026-0429, was never
    # ignorable: it is the one that turned the whole gate red and forced the
    # bump, because `Vec::with_capacity` aborts the process rather than
    # panicking, so no caller could have contained it.
    # MAINNET BLOCKER. Timing variability in operations crypto-bigint
    # intends to be constant-time (published 2026-10-23). EXPIRES 2026-12-23
    # or any mainnet deploy, whichever is sooner.
    #
    # RENEWED 2026-11-23 (previous EXPIRES was today). Re-checked, not just
    # re-dated: `crypto-bigint 0.7.6`, the fix version this ignore originally
    # named, is now yanked by its author - no longer installable at all.
    # Re-ran the bump attempt from scratch: `cargo update -p elliptic-curve
    # --precise 0.14.3 --dry-run` and `cargo update -p k256 --precise 0.14.0
    # --dry-run` both fail - `alloy-primitives` (pulled into every binary
    # that links `evm`, not something a narrower change avoids) still hard-
    # requires `k256 = "^0.13"` at its latest published release, 1.7.3,
    # confirmed against the registry directly. But the dry-run's own
    # resolver error names `server`'s manifest directly too: our own
    # `k256 = "^0.13"` pin (evm/src/wallet/hd_wallet.rs,
    # server/src/api/users/wallets.rs and its test are the call sites) is an
    # equally real anchor, not merely downstream of alloy-primitives' - both
    # have to move before this bump is possible. Next review: re-run those
    # two dry-runs, and check both alloy-primitives's latest published
    # version and our own pin against this file's date - only take the bump
    # once neither blocks it.
    #
    # PATH: crypto-bigint 0.5.5 -> elliptic-curve 0.13.8 -> {ecdsa 0.16.9 ->
    # k256 0.13.4, alloy-signer 1.8.3} -> evm/server. No available path today
    # that does not wait on alloy-primitives to publish a compatible new
    # major.
    #
    # WHY NOT EXPLOITABLE HERE, traced through every real (non-test) caller,
    # not asserted: HdWallet (evm/src/wallet/hd_wallet.rs) is the only type
    # that ever holds a private master key and does crypto-bigint-adjacent
    # scalar arithmetic - every one of its methods does, not only
    # derive_private_key, because its paths are hardened at every segment up
    # to the account level and hardened BIP-32 can only be computed from a
    # private key. It is not feature-gated. But the deployed server binary
    # never constructs one: the only call to
    # HdWallet::from_mnemonic/from_seed outside tests is in
    # evm/src/bin/derive-xpub.rs, a separate CLI binary a merchant runs on
    # their own machine with their own mnemonic - never built or run by the
    # server. A timing side-channel there is moot: whoever runs it already
    # holds the secret being timed.
    #
    # The server's own per-invoice address derivation
    # (server/src/api/invoices/payment_options.rs -> XpubDeriver, in
    # evm/src/wallet/xpub_deriver.rs) holds only an XPub - parsed straight
    # from the merchant's pasted xpub string - and derives via
    # account_xpub.derive_child: EC point addition on public inputs, no
    # secret scalar anywhere in it. The other real k256 usage
    # (server/src/api/users/wallets.rs's verify_wallet_signature) is ECDSA
    # signature RECOVERY from a signature the user's own wallet already
    # produced - also a public operation on public inputs. Nothing in the
    # deployed server binary ever feeds a secret into a crypto-bigint-
    # adjacent operation; `hot-wallet` (evm/Cargo.toml, absent from
    # `default = []`, never passed by any CI workflow) stays irrelevant to
    # this argument rather than load-bearing for it.
    "RUSTSEC-2026-0387", # crypto-bigint timing variability - see the note above
    # rmcp RUSTSEC-2026-0462/0457 ignores removed: mcp-server is on rmcp
    # 3.9.0+, past the >=3.9.0 fix line this waiver's own condition named for
    # dropping it.
    # wasmtime RUSTSEC-2026-0315/0316/0325/0326/0327 ignores removed: the
    # commons `rev` bump landed, wasmtime is >=48.0.4, and
    # scripts/check-wasmtime-ignores.sh now fails on a fixed release with any
    # of the five still listed.
]
