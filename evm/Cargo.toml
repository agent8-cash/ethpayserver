[package]
name = "evm"
version = "0.1.0"
edition = "2024"
description = "EVM blockchain interaction layer for ethpayserver"
license = "MIT"

[[bin]]
name = "evmmonitor"
path = "src/bin/evmmonitor/main.rs"
required-features = ["monitor-bin"]

[[bin]]
name = "derive-xpub"
path = "src/bin/derive-xpub.rs"

[features]
default = []
api = ["axum", "utoipa", "types", "data-service", "auth"]
redis = ["dep:redis"]
test-utils = []
# Compiles evm::transaction, which can sign and broadcast outbound transfers
# from a derived payment address. Off by default and not turned on anywhere:
# the product is non-custodial and refunds/payouts are the merchant's job
# from their own wallet. Reserved for a possible future hot-wallet mode,
# which is a deliberate product decision, not something this flag should
# drift into on its own.
hot-wallet = []
# Sentry `before_send` PII scrubber and tracing event filter. Shared by the
# `server` and `evmmonitor` binaries so both run one audited implementation.
sentry-scrub = ["dep:sentry", "dep:sentry-tracing", "dep:tracing-subscriber", "dep:regex", "dep:anyhow"]
monitor-bin = ["redis", "types", "data-service", "data-service/redis", "dep:toml", "dep:tracing-subscriber", "dep:dotenvy", "dep:clap", "dep:anyhow", "dep:sentry", "dep:sentry-tracing", "sentry-scrub", "tokio/full"]

[dependencies]
# Ethereum/EVM - alloy ecosystem
alloy = { version = "1.0", features = [
    "providers",
    "provider-http",
    "provider-ws",
    "pubsub",
    "network",
    "contract",
    "rpc-types",
    "signers",
    "signer-local",
    "rand",
] }

# HD wallet derivation
coins-bip32 = "0.13"
coins-bip39 = "0.13"
k256 = "0.13"

# Tron address encoding: base58check over a 0x41-prefixed payload, with a
# double-SHA256 checksum. Both crates are already in the tree transitively
# (coins-bip32 and k256 respectively); named here because this crate uses them
# directly and a transitive dependency is not a promise.
bs58 = "0.5"
sha2 = "0.10"

# Async runtime
tokio = { version = "1.42", features = ["sync", "time"] }
tokio-stream = "0.1"
async-trait = "0.1"
async-stream = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"

# Logging
tracing = "0.1"

# Metrics
metrics = "0.24"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
url = { version = "2.5", features = ["serde"] }
hex = "0.4"
rand = "0.9"
uuid = { version = "1.11", features = ["v4", "serde"] }

# Event bridge - Redis (optional)
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"], optional = true }

# Binary dependencies (optional)
toml = { version = "0.8", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"], optional = true }
dotenvy = { version = "0.15", optional = true }
clap = { version = "4", features = ["derive", "env"], optional = true }
anyhow = { version = "1.0", optional = true }
sentry = { version = "0.49.3", default-features = false, features = ["backtrace", "contexts", "panic", "tracing", "reqwest", "rustls", "logs"], optional = true }
sentry-tracing = { version = "0.49.3", features = ["logs"], optional = true }

# PII/secret scrubber for Sentry error payloads (sentry-scrub feature)
regex = { version = "1", optional = true }

# API (optional)
axum = { version = "0.8", optional = true }
utoipa = { version = "5", features = ["axum_extras"], optional = true }
types = { workspace = true, optional = true }
data-service = { path = "../data-service", optional = true }
auth = { workspace = true, optional = true }
secrecy = { version = "0.10.3", features = ["serde"] }

[lints.clippy]
too_many_lines = { level = "deny", priority = -1 }
cognitive_complexity = "deny"

[dev-dependencies]
# The shared hand-written scrubber, asserted here to match the regex table
# below. Test-only: the binaries run the regex implementation.
scrub = { workspace = true }
tokio = { version = "1.42", features = ["full", "test-util"] }
# `test` unlocks `sentry::test::with_captured_envelopes_options`, which drives
# a log through the real subscriber -> sentry_tracing -> before_send_log path
# instead of calling `scrub_log` directly, so the test proves the wiring and
# not just the pure function. `tracing-subscriber` installs the layer that
# hooks `tracing::info!` up to that pipeline in the first place, and also
# lets `sentry_event_filter`'s tests observe a real `tracing::Event` through
# an installed layer instead of hand-building `tracing::Metadata`.
sentry = { version = "0.49.3", default-features = false, features = ["logs", "test"] }
# `env-filter` builds the same `LOG_LEVEL` filter `server.rs` and
# `evmmonitor/main.rs` do, so a test can construct their real layer stack
# instead of a lookalike missing the filter that caused the independence bug.
# It also backs test-only capture of what the redis-bridge shutdown log tails
# actually emit; the production `monitor-bin` feature depends on it separately.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Test-only: the server side of a real WebSocket handshake, used to make
# `alloy_pubsub`/`alloy_transport_ws` (pulled in transitively via `alloy`)
# hit an actual connection reset in ws_pubsub_retry_escalation.rs. Pinned to
# 0.28, the exact version alloy-transport-ws 1.8.3 itself depends on.
tokio-tungstenite = "0.28"
# Self-dependency, test-only: `evm/tests/*.rs` link against the compiled lib
# as an external crate, so `#[cfg(test)]` never applies to them, and the
# mock exports (`test-utils`) and `sentry_tracing` crate (`sentry-scrub`) are
# otherwise gated behind features nothing turns on when building `-p evm`
# alone. This line forces both on for the test build only - it does not
# change the default library build any other crate gets when depending on
# this one normally.
evm = { path = ".", features = ["test-utils", "sentry-scrub"] }
